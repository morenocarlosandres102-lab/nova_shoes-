{% extends "base.html" %}

{% block title %}Crear cuenta | Nova Shoes{% endblock %}

{% block content %}

<section class="seccion-pagina">

    <div class="formulario-contenedor">

        <h1>Crear una cuenta</h1>

        <p>Únete a Nova Shoes y disfruta de nuestra tienda.</p>

        {% if error %}
            <p class="mensaje-error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('registro') }}">

            <label>Nombre</label>
            <input type="text" name="nombre"
                   placeholder="Tu nombre" required>

            <label>Apellido</label>
            <input type="text" name="apellido"
                   placeholder="Tu apellido" required>

            <label>Correo electrónico</label>
            <input type="email" name="correo"
                   placeholder="Tu correo electrónico" required>

            <label>Teléfono</label>
            <input type="tel" name="telefono"
                   placeholder="Tu número de teléfono" required>

            <label>Contraseña</label>
            <input type="password" name="password"
                   placeholder="Crea una contraseña" required>

            <label>Confirmar contraseña</label>
            <input type="password" name="confirmar_password"
                   placeholder="Repite tu contraseña" required>

            <button type="submit">Registrarme</button>

        </form>

        <p>¿Ya tienes una cuenta?</p>

        <a href="{{ url_for('login') }}">Iniciar sesión</a>

    </div>

</section>

{% endblock %}
